# CodeQL — free for public repos, no GitHub Advanced Security required
# Runs CodeQL analysis (SAST) on push to main + weekly. Uses the open-source
# github/codeql-action — available on free tier for public repositories.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ponytail: one generic job — CodeQL auto-detects language; no matrix needed for generated SDKs
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # ponytail: autobuild does nothing for generated SDKs — queries still run on JS/py/go/etc sources
          languages: javascript-python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-python"
