# CodeQL — free for public repos, no GHAS required
# ponytail: pre-generation repos have no source (only workflows) → `actions` always succeeds
# After generation, if you want language-specific SAST, extend `languages` via bootstrap mapping
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Ensure dummy source for CodeQL (pre-generation repos have no source)
        run: |
          case "actions" in
            *javascript*) mkdir -p src && echo 'export const dummy=1;' > src/dummy.ts ;;
            *python*) echo '# dummy for CodeQL' > dummy.py ;;
            *go*) printf 'package dummy\nfunc Dummy() {}\n' > dummy.go; printf 'module example.com/dummy\ngo 1.21\n' > go.mod ;;
            *java*) mkdir -p src/main/java && echo 'public class Dummy {}' > src/main/java/Dummy.java; cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>dummy</artifactId><version>1.0</version></project>
          POM
            ;;
            *csharp*) mkdir -p Dummy && echo 'class Dummy {}' > Dummy/Dummy.cs; cat > Dummy/Dummy.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup></Project>
          CSPROJ
            ;;
            *ruby*) echo 'dummy=1' > dummy.rb ;;
            *swift*) mkdir -p Dummy && echo 'let dummy=1' > Dummy/dummy.swift ;;
            *cpp*) echo 'int dummy=1;' > dummy.cpp ;;
            *) echo "actions only - no dummy needed" ;;
          esac
          ls -R 2>&1 | head -n 30 || true
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:actions"
