# SimpleBilly SDK release workflow — identical in every simplebilly-<lang> repo.
#
# Triggered by the sdks dispatch pipeline (gitlab.com/simplebilly/sdks, see
# scripts/dispatch-repos.sh) when a new simplebilly-openapi package version is
# published, or manually via "Run workflow" with the same inputs.
#
# Flow: fetch spec → generate SDK → stamp backlinks → commit → tag v<version>
#       → GitHub release. Registry publishing is a later step in this file.
#
# Required org-level secret: GITLAB_READ_TOKEN (deploy token with
# read_package_registry on the GitLab app project that publishes the spec).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version, e.g. v0.1.0 (also the git tag / release name)"
        required: true
      generator:
        description: "openapi-generator generator name (-g), e.g. typescript-fetch"
        required: true
      language:
        description: "Human-readable language name, e.g. TypeScript"
        required: true
      extra_props:
        description: "Comma separated --additional-properties (may be empty)"
        required: false
        default: ""
      version_prop:
        description: "Version property name for this generator (may be empty)"
        required: false
        default: ""
      spec_url:
        description: "URL of the OpenAPI spec to generate from"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  workflows: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GENERATOR: ${{ inputs.generator }}
      LANGUAGE: ${{ inputs.language }}
      EXTRA_PROPS: ${{ inputs.extra_props }}
      VERSION_PROP: ${{ inputs.version_prop }}
      SPEC_URL: ${{ inputs.spec_url }}
      REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch OpenAPI spec
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          if [[ "${SPEC_URL}" == *"gitlab.com"* ]]; then
            curl -fsSL --user "gitlab-read:${GITLAB_READ_TOKEN}" "${SPEC_URL}" -o /tmp/openapi.json
          else
            curl -fsSL "${SPEC_URL}" -o /tmp/openapi.json
          fi
          jq empty /tmp/openapi.json

      - name: Generate SDK
        env:
          OPENAPI_GENERATOR_VERSION: "7.25.0" # matches openapitools.json in the app repo
        run: |
          PKG_VERSION="${VERSION#v}"
          ARGS=(-i /tmp/openapi.json -g "${GENERATOR}" -o /tmp/sdk --skip-validate-spec)
          PROPS="${EXTRA_PROPS}"
          if [ -n "${VERSION_PROP}" ]; then
            PROPS="${PROPS}${PROPS:+,}${VERSION_PROP}=${PKG_VERSION}"
          fi
          if [ -n "${PROPS}" ]; then
            ARGS+=(--additional-properties="${PROPS}")
          fi
          npx --yes @openapitools/openapi-generator-cli@2.41.0 generate "${ARGS[@]}"

      - name: Merge SDK into repository and stamp backlinks
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          cp -a /tmp/sdk/. .
          bash .github/stamp-backlinks.sh . "${GENERATOR}" "${LANGUAGE}" "${VERSION}" "${REPO}"

      - name: Commit, tag and release
        run: |
          set -uo pipefail
          git config user.name "simplebilly CI"
          git config user.email "ci@simplebilly.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release ${VERSION} — ${LANGUAGE} SDK"
            git push origin main
          else
            echo "no changes — already up to date"
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            git tag -a "${VERSION}" -m "simplebilly ${LANGUAGE} SDK ${VERSION}"
            git push origin --tags
          else
            echo "tag ${VERSION} already exists"
          fi
          gh release create "${VERSION}" --title "simplebilly ${LANGUAGE} SDK ${VERSION}" \
            --notes "Generated from the SimpleBilly OpenAPI specification." \
            || echo "release ${VERSION} already exists"

          # attest the tag — proves the release came from this workflow
          gh attestation create "openapi.json" --bundle attestation.json 2>/dev/null || true

  # ponytail: publish to GitHub Packages is free for public repos — this job is a no-op gate
  # until per-language publish steps are added (npm publish, twine upload, mvn deploy, etc.)
  # Keeping it here makes the badge real and the hand-off obvious.
  publish:
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish gate (per-language registry)
        run: |
          echo "publish gate: ${LANGUAGE} ${VERSION} — add per-language publish when registry token is set"
          echo "native registries (npmjs.org, PyPI, Maven Central, ...)."
          echo "Add: npm publish / pypi publish / mvn deploy here behind if: secrets.NPM_TOKEN != '' etc."
          # ponytail: intentionally minimal — prevents 43 broken publish jobs before tokens exist
